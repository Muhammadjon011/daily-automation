name: Daily Project Maintenance

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          mkdir -p logs
          echo "Updated: $(date -u)" >> logs/daily.log

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/daily.log

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: daily maintenance"
            git push
          fi
